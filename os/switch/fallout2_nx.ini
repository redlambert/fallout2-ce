; Switch screen settings for Fallout 2 CE and Fallout et tu.
; Keep this file in sdmc:/switch/fallout2/ (next to master.dat).
; It applies to both games.

[MAIN]
; Window size before scaling. 1708x960 at 2x gives an 854x480 game view,
; the same as the previous Switch release.
SCR_WIDTH=1708
SCR_HEIGHT=960

; 1 = draw the game at 2x (bigger text and UI), 0 = 1x (more map visible)
SCALE_2X=1

; 1 = run the CPU at 1785 MHz while playing (smoother), 0 = normal 1020 MHz
CPU_BOOST=1

; 1 = write frame timing to perf.log in this folder every 5 seconds
PERF_LOG=1
