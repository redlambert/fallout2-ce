; Switch screen settings for Fallout 2 CE and Fallout et tu.
; Keep this file in sdmc:/switch/fallout2/ (next to master.dat).
; It applies to both games.

[MAIN]
; Window size before scaling. 1708x960 at 2x gives an 854x480 game view,
; the same as the previous Switch release.
SCR_WIDTH=1708
SCR_HEIGHT=960

; 1 = draw the game at 2x (bigger text and UI), 0 = 1x (more map visible)
SCALE_2X=1

; 1 = run the CPU at 1785 MHz while playing (the Switch lowers graphics
;     speed while this is on), 0 = normal 1020 MHz
CPU_BOOST=1

; 1 = wait for each screen refresh (smooth, no frame pile-up), 0 = don't wait
VSYNC=1

; 1 = write frame timing to perf.log in this folder every 5 seconds
PERF_LOG=0

; Testing options for how frames are handed to the graphics driver.
; Leave these at their defaults unless testing.
; RENDER_TEXTURES: 1 = one screen texture, 2 = alternate between two
RENDER_TEXTURES=1
; RENDER_UPLOAD: 0 = SDL update, 1 = lock and copy
RENDER_UPLOAD=0
; RENDER_BATCHING: 1 = SDL batches draw calls, 0 = send immediately
RENDER_BATCHING=1
; RENDER_RESET_SECONDS: 0 = off, otherwise rebuild the renderer this often
RENDER_RESET_SECONDS=0
